# How to use this file:
#    Download this YAML file using the download button on the right side,
#    then upload it into the Flowchart Visualiser to render the diagram.
---
flowchart:
  description: "🧠 A General Decision Flow"

  steps:
    - key: start
      name: "🟢 Entry Point"
      subtitle: "A signal or idea appears"
      details: |
        Every process starts with an input — it could be a thought, event, signal, or trigger.

        This is where ambiguity begins.

    - key: observe
      name: "👁️ Observation"
      subtitle: "What is happening?"
      details: |
        The system or user observes incoming information.

        At this stage:
        - Data is raw
        - Meaning is not yet defined
        - Context is being formed

    - key: interpret
      name: "🧩 Interpretation"
      subtitle: "Assign meaning"
      details: |
        Information is analyzed and interpreted.

        Patterns start emerging and structure is applied to raw input.

        This step converts noise into understanding.

    - key: decision
      name: "⚖️ Decision Point"
      subtitle: "Choose a direction"
      details: |
        Based on interpretation, a decision is made.

        This is where the flow may branch or continue linearly.

    - key: action
      name: "🚀 Action / Transformation"
      subtitle: "Something changes"
      details: |
        The decision is executed.

        This could result in:
        - a transformation
        - a response
        - a new state of the system

    - key: outcome
      name: "🎯 Outcome"
      subtitle: "Final result"
      details: |
        The process reaches a stable output or observable result.

        This outcome may become the input for another cycle.
